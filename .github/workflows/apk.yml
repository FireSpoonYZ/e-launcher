name: APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pi-runtime/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
            ${{ env.ANDROID_HOME }}/platforms/android-36
          key: android-36-ndk-28.2.13676358-cmake-3.22.1

      - name: Install Android packages
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Missing repository secret DEBUG_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          test -s debug.keystore

      - name: Install web dependencies
        run: npm ci

      - name: Prepare Pi runtime
        shell: pwsh
        run: ./scripts/prepare-pi-runtime.ps1

      - name: Assemble APK
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug ${{ github.ref == 'refs/heads/main' && ':app:assembleRelease' || '' }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: e-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: e-launcher-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk e-launcher-debug.apk
          cp app/build/outputs/apk/release/app-release.apk e-launcher-release.apk
          notes=$(printf 'SHA: %s\nRun: %s/%s/actions/runs/%s' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi
          gh release create latest e-launcher-debug.apk e-launcher-release.apk \
            --title Latest \
            --notes "$notes" \
            --latest \
            --target "$GITHUB_SHA"
