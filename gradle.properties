android.useAndroidX=true
# Full APK (assembleDebug + assembleDebugAndroidTest) needs 4 GiB heap; the parent
# verified this exact override. No Gradle/Cargo job cap.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Kotlin project data stays at the KGP default (.kotlin/ per project, gitignored);
# a relative kotlin.project.persistent.dir hid compiler errors behind a missing
# relative log path during the tauri SDK build.
