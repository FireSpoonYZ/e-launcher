plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Opt-in emulator ABI; ordinary builds remain arm64-v8a.
def launcherAbis = (findProperty("launcherAbis") ?: "arm64-v8a").split(",").toList()

def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd', '/c', 'npm'] : ['npm']
def sharedWebInputs = rootProject.files(
        rootProject.fileTree('desktop/web/src'),
        rootProject.fileTree('host-core') { include '*.js', '*.d.ts' })

def installHostDependencies = tasks.register('installHostDependencies', Exec) {
    workingDir rootProject.file('host-core')
    commandLine npmCommand + ['ci']
    inputs.files rootProject.file('host-core/package.json'), rootProject.file('host-core/package-lock.json'),
            rootProject.fileTree('host-core') { include '.npmrc' }, rootProject.fileTree('.') { include '.npmrc' }
    outputs.dir rootProject.file('host-core/node_modules')
}
def prepareHostTools = tasks.register('prepareHostTools', Exec) {
    workingDir rootProject.file('host-core')
    commandLine 'node', 'prepare-android-tools.js',
            '--abis', launcherAbis.join(','),
            '--ndk', file("${android.sdkDirectory}/ndk/${android.ndkVersion}").absolutePath
    inputs.files rootProject.file('host-core/prepare-android-tools.js'),
            rootProject.file('host-core/package.json'), rootProject.file('host-core/package-lock.json')
    inputs.property 'abis', launcherAbis.join(',')
    outputs.dir file("$buildDir/generated/jniLibs/hostTools")
    outputs.dir file("$buildDir/host-native-tools/licenses")
}
def buildHostRuntime = tasks.register('buildHostRuntime', Exec) {
    dependsOn installHostDependencies, prepareHostTools
    workingDir rootProject.file('host-core')
    commandLine 'node', 'build-android.js'
    inputs.files rootProject.fileTree('host-core') { exclude 'build/**', 'node_modules/**' },
            rootProject.fileTree('center-contract'),
            rootProject.fileTree('plugins') { exclude 'build/**', 'node_modules/**' },
            rootProject.file('licenses/pi-v1.3.0-MIT.txt'),
            rootProject.file('licenses/hindsight-client-0.9.2-MIT.txt'),
            rootProject.file('licenses/standardwebhooks-1.1.1-LICENSE.txt'),
            file("$buildDir/host-native-tools/licenses")
    inputs.file file('build.gradle')
    outputs.dir file("$buildDir/generated/assets/botHost")
}
// Tauri UI process (:tauri_ui): Rust cdylib, wry/tauri generated Kotlin and the
// Android Rust third-party notices. The Rust library is release-built for both
// APK build types. host-core/build-mobile.js also writes mobile/build/tauri-sdk.gradle.
def tauriGeneratedKotlin = file("$buildDir/generated/source/tauri")
def tauriJniLibs = file("$buildDir/generated/jniLibs/tauri")
def tauriAssets = file("$buildDir/generated/assets/tauri")
def buildMobileUi = tasks.register('buildMobileUi', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'host-core/build-mobile.js',
            '--abis', launcherAbis.join(','),
            '--ndk', file("${android.sdkDirectory}/ndk/${android.ndkVersion}").absolutePath
    inputs.files rootProject.fileTree('mobile') {
                // Generated outputs and cargo/tool artifacts would self-trigger the task.
                exclude 'build/**', 'src-tauri/target/**', 'src-tauri/gen/**',
                        'src-tauri/permissions/autogenerated/**'
            },
            rootProject.fileTree('web/src'),
            sharedWebInputs,
            rootProject.fileTree('licenses'),
            rootProject.file('package.json'), rootProject.file('package-lock.json'),
            rootProject.file('vite.mobile.config.ts'),
            rootProject.file('host-core/build-mobile.js'), rootProject.file('host-core/build-desktop.js'),
            rootProject.file('host-core/desktop-tauri.js')
    inputs.property 'abis', launcherAbis.join(',')
    inputs.file file('build.gradle')
    outputs.dirs tauriGeneratedKotlin, tauriJniLibs, tauriAssets
}
tasks.matching { it.name in ['compileDebugKotlin', 'compileReleaseKotlin',
        'mergeDebugAssets', 'mergeReleaseAssets',
        'mergeDebugNativeLibs', 'mergeReleaseNativeLibs',
        'mergeDebugJniLibFolders', 'mergeReleaseJniLibFolders']
        || it.name.toLowerCase().contains('lint') }
        .configureEach { dependsOn buildMobileUi }

def syncHostNpm = tasks.register('syncHostNpm', Sync) {
    dependsOn installHostDependencies
    from rootProject.file('host-core/node_modules/npm')
    into "$buildDir/generated/assets/hostNpm/npm/11.6.2"
    doLast {
        file("$buildDir/generated/assets/hostNpm/npm/11.6.2/payload-complete.txt").setText('11.6.2\n', 'UTF-8')
    }
}
def syncAppAssets = tasks.register('syncAppAssets', Sync) {
    from('src/main/assets') { include 'cn-holidays.json', 'cn-holidays-LICENSE.txt' }
    into "$buildDir/generated/assets/app"
}
tasks.named('preBuild') { dependsOn syncAppAssets, syncHostNpm, buildHostRuntime, prepareHostTools, buildMobileUi }
tasks.matching { it.name in ['mergeDebugAssets', 'mergeReleaseAssets']
        || it.name.toLowerCase().contains('lint') }
        .configureEach { dependsOn buildHostRuntime }

android {
    namespace 'com.example.launcherprobe'
    compileSdk 36
    ndkVersion '28.2.13676358'

    signingConfigs {
        debug {
            storeFile rootProject.file(findProperty('emulatorTestKeystore') ?: 'debug.keystore')
            if (!storeFile.isFile()) {
                throw new GradleException('Missing debug.keystore in project root. Copy the shared development keystore from another development machine.')
            }
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    defaultConfig {
        applicationId 'com.example.launcherprobe'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1.0'
        ndk { abiFilters.addAll(launcherAbis) }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildFeatures {
        aidl true
        // Generated wry/tauri Kotlin (Logger.kt) reads BuildConfig.DEBUG.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs.useLegacyPackaging = true
        resources {
            // 这 8 个路径是 AGP 的默认排除项（签名/MANIFEST 等其余默认排除不动）。
            // 依赖自带的完整上游法务文本（如 jackson-databind 的 META-INF/LICENSE/NOTICE）
            // 必须随 APK 发出：只取消这 8 项排除，并按 AGP 标准 merge 合并同名文件。
            def upstreamLegalTexts = [
                    '/META-INF/LICENSE',
                    '/META-INF/LICENSE.txt',
                    '/META-INF/NOTICE',
                    '/META-INF/NOTICE.txt',
                    '/LICENSE',
                    '/LICENSE.txt',
                    '/NOTICE',
                    '/NOTICE.txt'
            ]
            excludes.removeAll(upstreamLegalTexts)
            merges.addAll(upstreamLegalTexts)
        }
    }

    androidResources {
        // npm requires underscore-prefixed directories such as __generated__.
        ignoreAssetsPattern = '!.git:!.svn:!.DS_Store:!*~'
    }

    sourceSets.main.assets.setSrcDirs([
            "$buildDir/generated/assets/app",
            "$buildDir/generated/assets/hostNpm",
            "$buildDir/generated/showerAssets",
            "$buildDir/generated/assets/botHost",
            "$buildDir/generated/assets/tauri"
    ])
    sourceSets.main.jniLibs.srcDir "$buildDir/generated/jniLibs/hostTools"
    sourceSets.main.jniLibs.srcDir "$buildDir/generated/jniLibs/tauri"
    sourceSets.main.java.srcDir "$buildDir/generated/source/tauri"
    sourceSets.debug.jniLibs.srcDir "$buildDir/generated/jniLibs/nodeLauncher/debug"
    sourceSets.release.jniLibs.srcDir "$buildDir/generated/jniLibs/nodeLauncher/release"
}

// Kotlin (BotHostTauriPlugin) must match the Java target or the KGP check fails.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}
kotlin.sourceSets.all { set ->
    if (set.name == 'main') set.kotlin.srcDir "$buildDir/generated/source/tauri"
}

['Debug', 'Release'].each { buildType ->
    def cmakeBuildType = buildType == 'Release' ? 'RelWithDebInfo' : buildType
    def syncTask = tasks.register("syncNodeLauncher${buildType}") {
        dependsOn "buildCMake${cmakeBuildType}"
        outputs.dir "$buildDir/generated/jniLibs/nodeLauncher/${buildType.toLowerCase()}"
        outputs.upToDateWhen { false }
        doLast {
            launcherAbis.each { abi ->
                def binaries = fileTree("$buildDir/intermediates/cxx/${cmakeBuildType}") { include "**/obj/${abi}/node_launcher" }.files
                if (binaries.isEmpty()) throw new GradleException("Missing ${abi} node_launcher")
                def binary = binaries.max { it.lastModified() }
                copy {
                    from binary
                    into "$buildDir/generated/jniLibs/nodeLauncher/${buildType.toLowerCase()}/${abi}"
                    rename { 'libnode_launcher.so' }
                }
            }
        }
    }
    tasks.matching { it.name == "merge${buildType}NativeLibs" || it.name == "merge${buildType}JniLibFolders" }
            .configureEach { dependsOn syncTask, prepareHostTools }
}

def syncShowerServer = tasks.register('syncShowerServer', Copy) {
    dependsOn ':shower-server:assembleRelease'
    from rootProject.file('shower-server/build/outputs/apk/release/shower-server-release-unsigned.apk')
    into "$buildDir/generated/showerAssets"
    rename { 'shower-server.jar' }
}
tasks.matching { it.name in ['mergeDebugAssets', 'mergeReleaseAssets']
        || it.name.toLowerCase().contains('lint') }
        .configureEach { dependsOn syncShowerServer }

dependencies {
    // Tauri Android SDK project (wry/tauri Kotlin, PluginManager) for TauriMainActivity.
    implementation project(':tauri-android')
    // Required by WryActivity's ProcessLifecycleOwner; version pinned by tauri-build.
    implementation 'androidx.lifecycle:lifecycle-process:2.10.0'
    // Required by wry's generated Kotlin (WebViewAssetLoader/WebViewCompat).
    implementation 'androidx.webkit:webkit:1.12.0'
    // The :tauri_ui lifecycle-only Startup provider needs the 1.2.0
    // InitializationProvider(Class) dispatch; the transitive 1.1.1 is insufficient.
    implementation 'androidx.startup:startup-runtime:1.2.0'
    // Same version the tauri SDK pins, so the app module can reuse Plugin.jsonMapper().
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
}
