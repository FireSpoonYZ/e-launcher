plugins {
    id 'com.android.application'
}

apply from: 'capacitor.build.gradle'

def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd', '/c', 'npm'] : ['npm']
def webDependencies = rootProject.fileTree('node_modules') {
    exclude '.cache/**', '.vite/**', '.vite-temp/**',
            '@capacitor/android/capacitor/build/**', '@capacitor/app/android/build/**'
}
def webBuildInputs = rootProject.files(
        rootProject.fileTree('web') { exclude 'dist/**', 'node_modules/**' },
        rootProject.fileTree('.') { include 'package*.json', '*.config.*', 'tsconfig*.json', '.env*', '.npmrc' },
        webDependencies)
def buildWeb = tasks.register('buildWeb', Exec) {
    workingDir rootProject.projectDir
    // The runner avoids writing Vite's temporary config bundle into node_modules.
    commandLine npmCommand + ['run', 'build', '--', '--configLoader', 'runner']
    inputs.files webBuildInputs
    inputs.file file('build.gradle')
    inputs.property 'nodeEnv', System.getenv('NODE_ENV') ?: ''
    inputs.property 'viteEnv', System.getenv().findAll { key, value -> key.startsWith('VITE_') }
    outputs.dir rootProject.file('web/dist')
}
def cordovaManifest = rootProject.file('capacitor-cordova-android-plugins/src/main/AndroidManifest.xml')
def copyWebAssets = tasks.register('copyWebAssets', Exec) {
    dependsOn buildWeb
    workingDir rootProject.projectDir
    commandLine npmCommand + ['exec', '--', 'cap', 'copy', 'android']
    inputs.dir rootProject.file('web/dist')
    inputs.files webDependencies, rootProject.file('capacitor.config.ts'),
            rootProject.file('package.json'), rootProject.file('package-lock.json')
    inputs.file file('build.gradle')
    outputs.dir file('src/main/assets/public')
    outputs.files file('src/main/assets/capacitor.config.json'), file('src/main/res/xml/config.xml'), cordovaManifest
    doFirst {
        // Capacitor copy only rewrites this side product if it already exists.
        cordovaManifest.parentFile.mkdirs()
        if (!cordovaManifest.exists()) cordovaManifest.createNewFile()
    }
}
def installPiDependencies = tasks.register('installPiDependencies', Exec) {
    workingDir rootProject.file('pi-runtime')
    commandLine npmCommand + ['ci']
    inputs.files rootProject.file('pi-runtime/package.json'), rootProject.file('pi-runtime/package-lock.json'),
            rootProject.fileTree('pi-runtime') { include '.npmrc' }, rootProject.fileTree('.') { include '.npmrc' }
    outputs.dir rootProject.file('pi-runtime/node_modules')
}
def buildPiRuntime = tasks.register('buildPiRuntime', Exec) {
    dependsOn installPiDependencies
    workingDir rootProject.file('pi-runtime')
    commandLine npmCommand + ['run', 'build:android']
    inputs.files rootProject.fileTree('pi-runtime') { exclude 'build/**', 'node_modules/.cache/**' }
    inputs.file file('build.gradle')
    outputs.file file('src/main/assets/pi-runtime.cjs')
    outputs.dirs file('src/main/assets/pi-sdk'), file('src/main/assets/npm')
}
tasks.named('preBuild') { dependsOn copyWebAssets, buildPiRuntime }

android {
    namespace 'com.example.launcherprobe'
    compileSdk 36
    ndkVersion '28.2.13676358'

    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            if (!storeFile.isFile()) {
                throw new GradleException('Missing debug.keystore in project root. Copy the shared development keystore from another development machine.')
            }
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    defaultConfig {
        applicationId 'com.example.launcherprobe'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'com.example.launcherprobe.ChatStoreChecks'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs.useLegacyPackaging = true
    }

    androidResources {
        // npm requires underscore-prefixed directories such as __generated__.
        ignoreAssetsPattern = '!.git:!.svn:!.DS_Store:!*~'
    }

    sourceSets.main.assets.srcDir "$buildDir/generated/showerAssets"
    sourceSets.debug.jniLibs.srcDir "$buildDir/generated/jniLibs/nodeLauncher/debug"
    sourceSets.release.jniLibs.srcDir "$buildDir/generated/jniLibs/nodeLauncher/release"
}

['Debug', 'Release'].each { buildType ->
    def cmakeBuildType = buildType == 'Release' ? 'RelWithDebInfo' : buildType
    def syncTask = tasks.register("syncNodeLauncher${buildType}") {
        dependsOn "buildCMake${cmakeBuildType}"
        outputs.dir "$buildDir/generated/jniLibs/nodeLauncher/${buildType.toLowerCase()}"
        outputs.upToDateWhen { false }
        doLast {
            def binaries = fileTree("$buildDir/intermediates/cxx/${cmakeBuildType}") { include '**/obj/arm64-v8a/node_launcher' }.files
            if (binaries.isEmpty()) throw new GradleException('Missing arm64 node_launcher')
            def binary = binaries.max { it.lastModified() }
            copy {
                from binary
                into "$buildDir/generated/jniLibs/nodeLauncher/${buildType.toLowerCase()}/arm64-v8a"
                rename { 'libnode_launcher.so' }
            }
        }
    }
    tasks.matching { it.name == "merge${buildType}NativeLibs" || it.name == "merge${buildType}JniLibFolders" }
            .configureEach { dependsOn syncTask }
}

def syncShowerServer = tasks.register('syncShowerServer', Copy) {
    dependsOn ':shower-server:assembleRelease'
    from rootProject.file('shower-server/build/outputs/apk/release/shower-server-release-unsigned.apk')
    into "$buildDir/generated/showerAssets"
    rename { 'shower-server.jar' }
}
tasks.matching { it.name in ['mergeDebugAssets', 'mergeReleaseAssets']
        || it.name.toLowerCase().contains('lint') }
        .configureEach { dependsOn syncShowerServer }

// sherpa-onnx wake word engine and model: downloaded once into the ignored root build/ cache and pinned by SHA-256.
def sherpaVersion = '1.13.8'
def sherpaCache = rootProject.file('build/downloads/sherpa-onnx')
def sherpaAar = new File(sherpaCache, "sherpa-onnx-static-link-onnxruntime-${sherpaVersion}.aar")
def kwsModelName = 'sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20'
def kwsArchive = new File(sherpaCache, "${kwsModelName}.tar.bz2")
def downloadPinned = { String url, File target, String sha256 ->
    def digest = { File file ->
        def md = java.security.MessageDigest.getInstance('SHA-256')
        file.withInputStream { input -> byte[] buffer = new byte[1 << 16]; int n; while ((n = input.read(buffer)) > 0) md.update(buffer, 0, n) }
        md.digest().encodeHex().toString()
    }
    if (target.isFile() && digest(target) == sha256) return
    target.parentFile.mkdirs()
    def partial = new File(target.path + '.part')
    // Uses the systemProp.https.proxy* settings from the user-level gradle.properties.
    new URL(url).withInputStream { input -> partial.withOutputStream { output -> output << input } }
    def actual = digest(partial)
    if (actual != sha256) { partial.delete(); throw new GradleException("Checksum mismatch for $url: $actual") }
    target.delete(); if (!partial.renameTo(target)) throw new GradleException("Cannot move $partial")
}
def downloadSherpaOnnx = tasks.register('downloadSherpaOnnx') {
    outputs.files sherpaAar, kwsArchive
    doLast {
        downloadPinned("https://github.com/k2-fsa/sherpa-onnx/releases/download/v${sherpaVersion}/${sherpaAar.name}",
                sherpaAar, 'b22c3fc1b6a45666d28892bb2f7694beeb77a8362d7ebd77c1a5431ec9435471')
        downloadPinned("https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/${kwsArchive.name}",
                kwsArchive, '68447f4fbc67e70eee3a93961f36e81e98f47aef73ce7e7ca00885c6cd3616a6')
    }
}
def syncKwsModel = tasks.register('syncKwsModel', Sync) {
    dependsOn downloadSherpaOnnx
    from({ tarTree(resources.bzip2(kwsArchive)) }) {
        include "${kwsModelName}/encoder-epoch-13-avg-2-chunk-16-left-64.int8.onnx"
        include "${kwsModelName}/decoder-epoch-13-avg-2-chunk-16-left-64.onnx"
        include "${kwsModelName}/joiner-epoch-13-avg-2-chunk-16-left-64.int8.onnx"
        include "${kwsModelName}/tokens.txt"
        eachFile { it.path = "kws/${it.name}" }
        includeEmptyDirs = false
    }
    into "$buildDir/generated/kwsAssets"
}
android.sourceSets.main.assets.srcDir "$buildDir/generated/kwsAssets"
tasks.named('preBuild') { dependsOn syncKwsModel }
tasks.matching { it.name.toLowerCase().contains('lint') }.configureEach { dependsOn syncKwsModel }

dependencies {
    implementation files(sherpaAar).builtBy(downloadSherpaOnnx)
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation 'com.belerweb:pinyin4j:2.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    implementation 'io.noties.markwon:inline-parser:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
}
