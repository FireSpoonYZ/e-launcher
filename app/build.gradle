plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.launcherprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.launcherprobe'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
}
