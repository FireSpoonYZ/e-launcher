plugins {
    id 'com.android.application'
}

apply from: 'capacitor.build.gradle'

def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd', '/c', 'npm'] : ['npm']
def buildWeb = tasks.register('buildWeb', Exec) {
    workingDir rootProject.projectDir
    commandLine npmCommand + ['run', 'build']
}
def copyWebAssets = tasks.register('copyWebAssets', Exec) {
    dependsOn buildWeb
    workingDir rootProject.projectDir
    commandLine npmCommand + ['exec', '--', 'cap', 'copy', 'android']
}
def installPiDependencies = tasks.register('installPiDependencies', Exec) {
    workingDir rootProject.file('pi-runtime')
    commandLine npmCommand + ['ci']
    inputs.files rootProject.file('pi-runtime/package.json'), rootProject.file('pi-runtime/package-lock.json')
    outputs.file rootProject.file('pi-runtime/node_modules/.package-lock.json')
}
def buildPiRuntime = tasks.register('buildPiRuntime', Exec) {
    dependsOn installPiDependencies
    workingDir rootProject.file('pi-runtime')
    commandLine npmCommand + ['run', 'build:android']
}
tasks.named('preBuild') { dependsOn copyWebAssets, buildPiRuntime }

android {
    namespace 'com.example.launcherprobe'
    compileSdk 36
    ndkVersion '28.2.13676358'

    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            if (!storeFile.isFile()) {
                throw new GradleException('Missing debug.keystore in project root. Copy the shared development keystore from another development machine.')
            }
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    defaultConfig {
        applicationId 'com.example.launcherprobe'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'com.example.launcherprobe.ChatStoreChecks'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs.useLegacyPackaging = true
    }

    androidResources {
        // npm requires underscore-prefixed directories such as __generated__.
        ignoreAssetsPattern = '!.git:!.svn:!.DS_Store:!*~'
    }

    sourceSets.main.assets.srcDir "$buildDir/generated/showerAssets"
    sourceSets.debug.jniLibs.srcDir "$buildDir/generated/jniLibs/nodeLauncher/debug"
    sourceSets.release.jniLibs.srcDir "$buildDir/generated/jniLibs/nodeLauncher/release"
}

['Debug', 'Release'].each { buildType ->
    def cmakeBuildType = buildType == 'Release' ? 'RelWithDebInfo' : buildType
    def syncTask = tasks.register("syncNodeLauncher${buildType}") {
        dependsOn "buildCMake${cmakeBuildType}"
        outputs.dir "$buildDir/generated/jniLibs/nodeLauncher/${buildType.toLowerCase()}"
        outputs.upToDateWhen { false }
        doLast {
            def binaries = fileTree("$buildDir/intermediates/cxx/${cmakeBuildType}") { include '**/obj/arm64-v8a/node_launcher' }.files
            if (binaries.isEmpty()) throw new GradleException('Missing arm64 node_launcher')
            def binary = binaries.max { it.lastModified() }
            copy {
                from binary
                into "$buildDir/generated/jniLibs/nodeLauncher/${buildType.toLowerCase()}/arm64-v8a"
                rename { 'libnode_launcher.so' }
            }
        }
    }
    tasks.matching { it.name == "merge${buildType}NativeLibs" || it.name == "merge${buildType}JniLibFolders" }
            .configureEach { dependsOn syncTask }
}

def syncShowerServer = tasks.register('syncShowerServer', Copy) {
    dependsOn ':shower-server:assembleRelease'
    from rootProject.file('shower-server/build/outputs/apk/release/shower-server-release-unsigned.apk')
    into "$buildDir/generated/showerAssets"
    rename { 'shower-server.jar' }
}
tasks.matching { it.name in ['mergeDebugAssets', 'mergeReleaseAssets']
        || it.name.toLowerCase().contains('lint') }
        .configureEach { dependsOn syncShowerServer }

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation 'com.belerweb:pinyin4j:2.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    implementation 'io.noties.markwon:inline-parser:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
}
