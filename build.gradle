plugins {
    id 'com.android.application' version '8.13.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.3.20' apply false
}

// The :tauri-android SDK project is included from the cargo registry, which usually
// lives on a different drive than the checkout. Kotlin's incremental cache cannot
// relativize source paths across drives, so only that project compiles fully.
// AbstractKotlinCompile.getIncremental()/setIncremental(boolean) is public API.
gradle.projectsEvaluated {
    def tauriAndroid = rootProject.findProject(':tauri-android')
    if (tauriAndroid == null) return
    if (tauriAndroid.projectDir.toPath().root == rootProject.projectDir.toPath().root) return
    tauriAndroid.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        incremental = false
    }
}
